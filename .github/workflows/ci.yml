---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.4

      - name: Install project dependencies
        run: uv sync --locked

      - name: Prepare generated files
        run: |
          cp ansible/inventory/hosts.example.yml ansible/inventory/hosts.yml
          cp fleet/providers/manual/hosts.example.yml fleet/providers/manual/hosts.yml

      - name: Initialize OpenTofu
        run: tofu -chdir=fleet/providers/hcloud init -backend=false -input=false

      - name: Validate OpenTofu
        run: |
          tofu -chdir=fleet/providers/hcloud fmt -check -diff
          tofu -chdir=fleet/providers/hcloud validate

      - name: Lint YAML and Ansible
        run: |
          uv run yamllint .
          cd ansible
          uv run ansible-lint
          uv run ansible-playbook playbook.yml --syntax-check

      - name: Lint shell scripts
        run: |
          shellcheck -x scripts/*.sh tests/*.sh
          shellcheck scripts/lib/*.sh fleet/providers/*/*.sh
