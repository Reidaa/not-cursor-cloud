---
devboxes:
  vars:
    ansible_user: admin
  children:
    hcloud_devboxes:
      hosts:
        devbox-1:
          hcloud_server_type: cx33
          hcloud_location: hel1
          hcloud_image: ubuntu-24.04
          hcloud_enable_public_ssh: false
          hcloud_delete_protection: true
        devbox-2:
          hcloud_server_type: cax31
          hcloud_location: fsn1
          hcloud_image: ubuntu-26.04
          hcloud_enable_public_ssh: true
          hcloud_delete_protection: true
    manual_devboxes:
      hosts: {}
