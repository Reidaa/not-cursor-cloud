---
# hcloud_devboxes lists its hosts instead of mapping them. Read literally this
# is a group with no hosts, which would plan the deletion of every server, so
# both the inventory check and OpenTofu must refuse it.
devboxes:
  vars:
    ansible_user: admin
  children:
    hcloud_devboxes:
      hosts:
        - devbox-1
    manual_devboxes:
      hosts: {}
