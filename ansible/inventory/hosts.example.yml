---
devboxes:
  vars:
    ansible_user: admin

  children:
    # OpenTofu creates only hosts in this group.
    hcloud_devboxes:
      hosts:
        # Location and image force a replacement when changed. For a host that
        # already exists, set them to what it was created with.
        devbox-1:
          hcloud_server_type: cx33
          hcloud_location: nbg1
          hcloud_image: ubuntu-24.04
          hcloud_enable_public_ssh: true
          hcloud_delete_protection: true
          claude_keepalive_enabled: true

    # You create these machines and give each one an address for its first run.
    manual_devboxes:
      hosts:
        # devbox-2:
        #   ansible_host: 192.168.1.40
        #   ansible_user: local-admin
        #   claude_keepalive_enabled: false
