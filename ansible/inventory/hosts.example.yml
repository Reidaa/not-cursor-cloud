---
# Fleet membership, and nothing else. Who created a machine and what it costs
# belong to that machine's provider under fleet/providers/.
#
# A host is reached by its own name: the tailscale role enrols every DevBox
# under its inventory name, so MagicDNS answers for it after the first run.
# Per-host application settings go in host_vars/<name>.yml next to this file.
devboxes:
  vars:
    ansible_user: admin

  hosts:
    devbox-1:

    # A machine whose admin account is not the fleet default.
    # devbox-2:
    #   ansible_user: local-admin
