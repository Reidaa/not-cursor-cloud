---
- name: Check Tailscale release support
  ansible.builtin.include_tasks: validate_repository.yml

- name: Add Tailscale signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_signing_key_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "{{ tailscale_apt_repository }}"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Bring Tailscale up (first enrollment only)
  ansible.builtin.command: >
    tailscale up
    --authkey {{ tailscale_authkey }}
    --hostname {{ inventory_hostname }}
    --ssh
  no_log: true
  changed_when: true
  when:
    - tailscale_authkey | default('') | length > 0
    - tailscale_state.rc != 0 or (tailscale_state.stdout | from_json).BackendState != 'Running'

- name: Refresh Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep the tailnet machine name equal to the DevBox name
  ansible.builtin.include_tasks: set_machine_name.yml

- name: Report enrollment status
  ansible.builtin.debug:
    msg: >
      Tailscale backend state:
      {{ (tailscale_state.stdout | from_json).BackendState
         if tailscale_state.rc == 0 else 'unknown' }}.

- name: Explain manual Tailscale enrollment
  ansible.builtin.debug:
    msg: |
      The DevBox has Tailscale but no tailnet enrollment.

      1. On your local machine, connect to the DevBox:
         ssh {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}

      2. Inside the DevBox, enroll it in your tailnet:
         sudo tailscale up --hostname {{ inventory_hostname }} --ssh
         exit

      3. Back on your local machine, rerun the playbook.
  when: tailscale_state.rc != 0 or (tailscale_state.stdout | from_json).BackendState != 'Running'
