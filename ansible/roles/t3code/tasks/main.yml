---
- name: Install the T3 Code CLI
  ansible.builtin.include_role:
    name: npm_cli
  vars:
    npm_cli_package: t3
    npm_cli_bin: "{{ t3code_bin }}"

- name: Install t3code systemd service
  ansible.builtin.template:
    src: t3code.service.j2
    dest: /etc/systemd/system/t3code.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart t3code

- name: Enable and start t3code
  ansible.builtin.systemd_service:
    name: t3code
    enabled: true
    state: started
    daemon_reload: true

- name: Check current Tailscale Serve config
  ansible.builtin.command: tailscale serve status
  register: t3code_serve_status
  changed_when: false
  failed_when: false
