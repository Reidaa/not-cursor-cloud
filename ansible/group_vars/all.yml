---
timezone: "{{ lookup('ansible.builtin.env', 'AGENT_TIMEZONE') | default('UTC', true) }}"

# Accounts
admin_user: "{{ ansible_user }}"
agent_user: "{{ lookup('ansible.builtin.env', 'AGENT_USER') | default('agent', true) }}"
agent_home: "/home/{{ agent_user }}"

# Directory layout
agent_root: "{{ agent_home }}"
agent_workspaces: "{{ agent_root }}/workspaces"
agent_cache: "{{ agent_root }}/.cache"
agent_state: "{{ agent_root }}/.state"

# T3 Code service
t3code_bin: t3
t3code_host: 127.0.0.1
t3code_port: 3773

# Tailscale
tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTHKEY') | default('', true) }}"

# The supported Ubuntu releases live in fleet/contract.json, which the play
# loads, so adding a release does not mean editing this file too.
supported_architectures:
  - x86_64
  - aarch64

claude_keepalive_enabled: false

base_packages:
  - git
  - curl
  - wget
  - jq
  - ripgrep
  - unzip
  - xz-utils
  - build-essential
  - htop
  - tmux
  - cron
  - logrotate
